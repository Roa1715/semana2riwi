<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Rueda Libre</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased flex items-center justify-center min-h-screen">

    <main class="max-w-xl mx-auto p-6 bg-slate-800 rounded-2xl shadow-xl border border-slate-700 m-4">
        <!-- Etiqueta de campaña -->
        <span class="inline-block bg-emerald-500/20 text-emerald-400 text-xs font-semibold px-3 py-1 rounded-full mb-4">
            Nuevo · Jueves a sábado
        </span>

        <!-- Título y Subtítulo principal -->
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-2">
            Rueda Nocturna
        </h1>
        <p class="text-slate-300 text-base md:text-lg mb-6">
            Descubre Medellín en bici cuando se encienden las luces.
        </p>

        <!-- Datos destacados -->
        <div class="grid grid-cols-2 gap-4 mb-6 py-4 border-y border-slate-700 text-center">
            <div>
                <span class="block text-2xl font-bold text-emerald-400">3 rutas</span>
                <span class="text-xs text-slate-400 uppercase tracking-wider">Disponibles</span>
            </div>
            <div>
                <span class="block text-2xl font-bold text-emerald-400">Desde $55.000</span>
                <span class="text-xs text-slate-400 uppercase tracking-wider">Tarifa base</span>
            </div>
        </div>

        <!-- Enlace con apariencia de botón -->
        <div>
            <a href="#" class="block w-full text-center bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 shadow-md">
                Inscríbete
            </a>
        </div>
    </main>

</body>
</html>
